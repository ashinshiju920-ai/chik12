<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A663"/>
      <stop offset="50%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C85A32" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corner Luxury Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Center Luxury Diva'Chik Monogram 'D' with Silhouette Aesthetics -->
  <g transform="translate(60, 40)" filter="url(#glow)">
    <!-- Stylized D with Silhouette Profile Accent -->
    <path d="M 60 80 L 170 80 C 270 80 340 140 340 220 C 340 300 270 360 170 360 L 60 360 Z M 120 135 L 120 305 L 165 305 C 230 305 275 270 275 220 C 275 170 230 135 165 135 Z" fill="url(#goldGrad)"/>
    
    <!-- Profile Silhouette Curve Accents -->
    <path d="M 120 170 Q 155 190 145 220 Q 135 245 165 255 Q 140 275 120 290 Z" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Flowing Hair Waves inside D -->
    <path d="M 95 140 Q 130 180 115 225 Q 100 270 130 310" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M 75 155 Q 110 195 95 240 Q 80 285 110 325" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Small Chic Accent Sparkle -->
  <path d="M 390 100 Q 405 100 405 85 Q 405 100 420 100 Q 405 100 405 115 Q 405 100 390 100 Z" fill="#FFFFFF"/>
  <path d="M 340 380 Q 350 380 350 370 Q 350 380 360 380 Q 350 380 350 390 Q 350 380 340 380 Z" fill="url(#goldGrad)"/>
</svg>
